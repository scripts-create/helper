<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RS3 SuperTool v19</title>
<style>
body{margin:0;background:#090a10;color:#f3f3f8;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr auto;height:100vh;gap:10px;padding:10px}
.panel{background:#181824;border:1px solid #4b4b68;border-radius:12px;padding:14px;box-shadow:0 0 24px #0008;overflow:auto}
.hero{position:relative}.small{font-size:11px;color:#aaaabb;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
#best{font-size:40px;font-weight:950;color:#35a7ff;margin-top:6px}#reason{font-size:15px;font-weight:700;margin-top:8px}
.spark{position:absolute;right:22px;top:24px;font-size:72px;color:#b66dff}
.main{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side{grid-row:1/3;grid-column:2}
button,select{background:#2a2b3c;color:white;border:1px solid #ffffff25;border-radius:8px;padding:8px 10px;margin:3px;font-weight:800}
button.active{outline:2px solid #ffd91a}.danger{outline:2px solid #27f36b!important;background:#16341f}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff12;padding:7px 0;font-size:13px}.row span:first-child{color:#aaaabb}.row span:last-child{font-weight:800}
.card{background:#0c0c14;border:1px solid #ffffff14;border-radius:8px;padding:9px;margin-bottom:8px;font-size:13px}.card b{color:#ffd91a;display:block;margin-bottom:4px}
.icon{width:28px;height:28px;border-radius:5px;vertical-align:middle;margin-right:7px;background:#111;border:1px solid #ffffff18}
.queue{font-size:18px;font-weight:800;line-height:1.7}.footer{grid-column:1/3;color:#aaaabb;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.yellow{color:#ffd91a}.green{color:#27f36b}.red{color:#ff4a4a}.cyan{color:#00e5ff}.purple{color:#b66dff}.orange{color:#ff8a35}
</style>
</head>
<body>
<div class="app">
  <div class="panel hero">
    <div class="small">RS3 SuperTool v19 Emergency Fixed</div>
    <div id="best">READY</div>
    <div id="reason">If you can see this UI, the install is fixed.</div>
    <div class="spark">✦</div>
  </div>

  <div class="panel side">
    <h2>Controls</h2>
    <label>Boss</label>
    <select id="boss"></select>
    <label>Rotation</label>
    <select id="rotation"></select>
    <label>EOF</label>
    <select id="eof"></select>

    <h3>Adrenaline</h3>
    <div class="grid">
      <button onclick="setAdren('Low')">Low</button>
      <button onclick="setAdren('Mid')">Mid</button>
      <button onclick="setAdren('High')">High</button>
      <button onclick="setAdren('Full')">Full</button>
    </div>

    <h3>State</h3>
    <button id="sunBtn" onclick="toggle('sunshine')">Sunshine</button>
    <button id="fsoaBtn" onclick="toggle('fsoa')">FSoA</button>
    <button id="tsunamiBtn" onclick="toggle('tsunami')">Tsunami</button>
    <button id="dangerBtn" onclick="toggle('danger')">Danger</button>

    <h3>Used Abilities</h3>
    <button onclick="useAbility('GConc')">GConc</button>
    <button onclick="useAbility('Wild Magic')">Wild Magic</button>
    <button onclick="useAbility('Asphyxiate')">Asphyxiate</button>
    <button onclick="useAbility('Omnipower')">Omnipower</button>
    <button onclick="useAbility('EOF')">EOF</button>
    <button onclick="clearUsed()">Clear</button>

    <h3>App</h3>
    <button onclick="scan()">Scan Alt1</button>
    <button onclick="resetAll()">Reset</button>

    <div id="stateRows"></div>
  </div>

  <div class="main">
    <div class="panel">
      <h2>Next Queue</h2>
      <div id="queue" class="queue"></div>
      <h2>Cooldowns</h2>
      <div id="cooldowns"></div>
    </div>
    <div class="panel">
      <h2>Live Rules</h2>
      <div id="rules"></div>
      <h2>Diagnostics</h2>
      <div id="diag"></div>
    </div>
  </div>

  <div class="panel footer">
    Manual-only Alt1 overlay. No injection, no memory reading, no clicks, no automated gameplay.
  </div>
</div>

<script>
const WIKI="https://runescape.wiki/images/Special:FilePath/";
const ICONS={
 "GConc":"Greater_Concentrated_Blast.png",
 "Sonic Wave":"Sonic_Wave.png",
 "Dragon Breath":"Dragon_Breath.png",
 "Corruption Blast":"Corruption_Blast.png",
 "Combust":"Combust.png",
 "Wild Magic":"Wild_Magic.png",
 "Asphyxiate":"Asphyxiate.png",
 "Omnipower":"Omnipower.png",
 "Sunshine":"Sunshine.png",
 "Tsunami":"Tsunami.png",
 "FSoA":"Fractured_Staff_of_Armadyl.png",
 "EOF":"Essence_of_Finality_amulet.png",
 "Armadyl Battlestaff":"Armadyl_battlestaff.png",
 "Guthix Staff":"Guthix_staff.png",
 "Staff of Light":"Staff_of_light.png",
 "Iban's Staff":"Iban%27s_staff.png"
};
const BOSSES=["General PvM","Zamorak","Rasial","Raksha","Kerapac","Telos","Solak","Vorago","AoD","Arch-Glacor","Araxxor","QBD"];
const ROTATIONS=["Balanced Magic","Normal No-4TAA","Sweaty 4TAA","FSoA Burst","Sunshine Burst","AoE Magic","Sustain / Safe","Execute / Dump","Learner Safe"];
const EOFS=["Armadyl Battlestaff","Guthix Staff","Staff of Light","Iban's Staff"];
const CD={"GConc":5.4,"Wild Magic":20.4,"Asphyxiate":20.4,"Omnipower":30,"Sunshine":60,"Tsunami":30,"FSoA":60,"EOF":30};
let s={adren:"Mid",boss:"General PvM",rotation:"Balanced Magic",eof:"Armadyl Battlestaff",sunshine:false,fsoa:false,tsunami:false,danger:false,used:{},cd:{},alt1:false};
function img(n){return '<img class="icon" src="'+WIKI+(ICONS[n]||"Magic.png")+'">'}
function rem(n){return Math.max(0,(s.cd[n]||0)-Date.now()/1000)}
function ready(n){return rem(n)<=0}
function setAdren(v){s.adren=v;render()}
function toggle(k){s[k]=!s[k];if(k==="sunshine"&&s[k])useAbility("Sunshine",false);if(k==="fsoa"&&s[k])useAbility("FSoA",false);if(k==="tsunami"&&s[k])useAbility("Tsunami",false);render()}
function useAbility(n,r=true){s.cd[n]=Date.now()/1000+(CD[n]||30);if(["GConc","Wild Magic","Asphyxiate","Omnipower"].includes(n))s.used[n]=true;if(r)render()}
function clearUsed(){s.used={};render()}
function resetAll(){s={adren:"Mid",boss:"General PvM",rotation:"Balanced Magic",eof:"Armadyl Battlestaff",sunshine:false,fsoa:false,tsunami:false,danger:false,used:{},cd:{},alt1:false};initSelects();render()}
function scan(){s.alt1=!!window.alt1;render()}
function hasThresh(){return["Mid","High","Full"].includes(s.adren)}
function hasUlt(){return["High","Full"].includes(s.adren)}
function decide(){
 if(s.danger)return ["STABILIZE","Danger ON. Survival overrides DPS.",["Resonance / Devotion","Freedom / Anticipation","Debilitate / Reflect","Eat / reposition"],"#27f36b"];
 if(s.fsoa){
  if(!s.tsunami&&ready("Tsunami"))return ["TSUNAMI","FSoA active; Tsunami missing.",["FSoA spec","Wild Magic","Asphyxiate","GConc","Omnipower"],"#00e5ff"];
  if(hasThresh()&&ready("Wild Magic")&&!s.used["Wild Magic"])return ["WILD MAGIC","FSoA/Tsunami burst. Wild Magic ready.",["Asphyxiate","GConc","Omnipower","EOF: "+s.eof],"#ff4a4a"];
  if(hasThresh()&&ready("Asphyxiate")&&!s.used["Asphyxiate"])return ["ASPHYXIATE","Continue FSoA burst.",["GConc","Omnipower","EOF: "+s.eof],"#b66dff"];
  if(hasUlt()&&ready("Omnipower")&&!s.used["Omnipower"])return ["OMNIPOWER","High adrenaline during burst.",["GConc","EOF: "+s.eof,"Wild Magic when ready"],"#00e5ff"];
  if(hasThresh()&&ready("EOF"))return ["EOF: "+s.eof,"EOF dump available.",["GConc","Wild Magic when ready","Asphyxiate when ready"],"#ff8a35"];
  return ["GCONC / SONIC","Rebuild during FSoA.",["Dragon Breath","Corruption Blast","Threshold when ready"],"#35a7ff"];
 }
 if(s.sunshine){
  if(hasThresh()&&ready("Wild Magic")&&!s.used["Wild Magic"])return ["WILD MAGIC","Sunshine active. Wild Magic ready.",["Asphyxiate","GConc","Omnipower"],"#ff4a4a"];
  if(hasThresh()&&ready("Asphyxiate")&&!s.used["Asphyxiate"])return ["ASPHYXIATE","Dump thresholds inside Sunshine.",["GConc","Omnipower","Wild Magic when ready"],"#b66dff"];
  if(hasUlt()&&ready("Omnipower")&&!s.used["Omnipower"])return ["OMNIPOWER","High adrenaline inside Sunshine.",["GConc","EOF","Wild Magic"],"#00e5ff"];
  return ["GCONC / SONIC","Rebuild inside Sunshine.",["Dragon Breath","Corruption Blast","Threshold when ready"],"#35a7ff"];
 }
 if(["High","Full"].includes(s.adren)&&ready("Sunshine"))return ["START BURST","High adrenaline. Start Sunshine/FSoA.",["Sunshine","Tsunami if FSoA","FSoA spec","Wild Magic"],"#ffd91a"];
 if(ready("GConc")&&!s.used["GConc"])return ["GCONC / SONIC","Best builder available.",["Dragon Breath","Corruption Blast","Combust","Build to Sunshine"],"#35a7ff"];
 return ["DRAGON BREATH","GConc unavailable/marked. Continue basics.",["Corruption Blast","Combust","GConc when ready"],"#35a7ff"];
}
function render(){
 let d=decide();
 document.getElementById("best").textContent=d[0];
 document.getElementById("best").style.color=d[3];
 document.getElementById("reason").textContent=d[1];
 document.querySelector(".spark").style.color=d[3];
 document.getElementById("queue").innerHTML=d[2].map(x=>"<div>"+iconForText(x)+"→ "+x+"</div>").join("");
 document.getElementById("cooldowns").innerHTML=Object.keys(CD).map(n=>'<div class="card"><b>'+img(n)+n+'</b><span class="'+(ready(n)?"green":"orange")+'">'+(ready(n)?"READY":rem(n).toFixed(1)+"s")+"</span></div>").join("");
 document.getElementById("rules").innerHTML=["Boss: "+s.boss,"Rotation: "+s.rotation,"EOF: "+s.eof,"Danger overrides DPS","FSoA + Tsunami → WM → Asphyxiate → Omni/EOF"].map(x=>'<div class="card">'+x+"</div>").join("");
 document.getElementById("stateRows").innerHTML=[["Boss",s.boss],["Rotation",s.rotation],["Adrenaline",s.adren],["Sunshine",s.sunshine?"ON":"OFF"],["FSoA",s.fsoa?"ON":"OFF"],["Tsunami",s.tsunami?"ON":"OFF"],["Danger",s.danger?"ON":"OFF"],["Alt1",s.alt1?"Detected":"Not detected"]].map(r=>'<div class="row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join("");
 document.getElementById("diag").innerHTML=[["File","index.html"],["Version","v19"],["Alt1",!!window.alt1?"Detected":"Not detected"],["Loaded","OK"]].map(r=>'<div class="row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join("");
 ["sun","fsoa","tsunami"].forEach(k=>document.getElementById(k+"Btn").classList.toggle("active",s[{sun:"sunshine",fsoa:"fsoa",tsunami:"tsunami"}[k]]));
 document.getElementById("dangerBtn").classList.toggle("danger",s.danger);
}
function iconForText(t){for(let k in ICONS){if(t.toLowerCase().includes(k.toLowerCase().split(" ")[0]))return img(k)}return ""}
function initSelects(){
 let boss=document.getElementById("boss"),rot=document.getElementById("rotation"),eof=document.getElementById("eof");
 boss.innerHTML=BOSSES.map(x=>"<option>"+x+"</option>").join("");rot.innerHTML=ROTATIONS.map(x=>"<option>"+x+"</option>").join("");eof.innerHTML=EOFS.map(x=>"<option>"+x+"</option>").join("");
 boss.onchange=e=>{s.boss=e.target.value;render()};rot.onchange=e=>{s.rotation=e.target.value;render()};eof.onchange=e=>{s.eof=e.target.value;render()};
}
initSelects();render();setInterval(render,500);
</script>
</body>
</html>
